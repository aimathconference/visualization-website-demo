name: Flag an account for removal
description: Moderators only. This repository is private; admins review these flags.
title: 'Account: '
labels: ['flag:account']
body:
  - type: input
    id: account
    attributes:
      label: Account
      description: Link to their profile in the demo (the Flag button fills this in).
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this account be removed?
    validations:
      required: true

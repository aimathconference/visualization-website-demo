# The review bot. Runs after "check" with write access, from the default branch, and never checks out the
# pull request. See .loci/triage.cjs for what it does.
name: triage
on:
  workflow_run:
    workflows: [check]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  triage:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: check-result
          path: check-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # the best-effort dynamic checks (check.yml's "dynamic" job); missing when that job didn't get that far
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dynamic-result
          path: dynamic-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const triage = require('./.loci/triage.cjs');
            await triage({ github, context, core });

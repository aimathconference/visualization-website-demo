# The automated check on every pull request (docs/submission-spec-slop.md, sections 10 and 11; docs/sandbox.md).
# It runs on pull_request, never pull_request_target: no secrets and a read-only token. The checker comes from the
# base branch so a pull request can't change the rules. For a fork, GitHub still runs this FILE as the pull request
# has it, so a maintainer approves each outside contributor's run after checking that .github/ is untouched.
#  - check (required: the ruleset needs it to pass): .eigenreel/check-entries.mjs reads the pull request's files as
#    data, through spec.js (the same static gate as the Chalkboard). Submitted code is never executed in this job.
#  - dynamic (best effort, never blocks): plays each changed piece in headless Chromium, in the site's sandboxed
#    worker. Its result is an artifact the triage bot mentions in a comment.
name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checker, from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: The pull request's files (read as data only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix base/.eigenreel --ignore-scripts
      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | "\(.status)\t\(.filename)\t\(.previous_filename // "")"' > changed.tsv
      # Section 11: a piece's GitHub author is whoever opened the pull request that first added entries/<slug>.js,
      # by numeric id. For each piece this pull request touches that is already on the base branch, find the oldest
      # commit to entries/<slug>.js there and the pull request it came from. null when it came from no pull request.
      - name: Who first added each piece
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo '{}' > first-author.json
          slugs=$(cut -f2,3 changed.tsv | tr '\t' '\n' \
            | sed -n -e 's|^entries/\([a-z0-9][a-z0-9-]*\)\.\(js\|md\|wasm\)$|\1|p' -e 's|^sources/\([a-z0-9][a-z0-9-]*\)/.*$|\1|p' | sort -u)
          for slug in $slugs; do
            [ -f "base/entries/$slug.js" ] || continue
            sha=$(gh api --paginate "repos/$REPO/commits?sha=$BASE_SHA&path=entries/$slug.js&per_page=100" --jq '.[].sha' | tail -n 1 || true)
            id=null
            if [ -n "$sha" ]; then
              id=$(gh api "repos/$REPO/commits/$sha/pulls" --jq '.[0].user.id // null' || echo null)
            fi
            echo "$id" | grep -Eq '^[0-9]+$' || id=null
            jq --arg slug "$slug" --argjson id "$id" '.[$slug] = $id' first-author.json > first-author.tmp && mv first-author.tmp first-author.json
          done
          cat first-author.json
      - name: Check the entries
        run: node base/.eigenreel/check-entries.mjs pr changed.tsv "${{ github.event.pull_request.user.id }}" first-author.json > result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-result
          path: result.json
      - name: Pass or fail
        # (a block scalar: the script's colons would end a plain YAML value)
        run: |
          node -e "const r = JSON.parse(require('fs').readFileSync('result.json', 'utf8')); const at = e => (e.file || 'submission') + (e.line ? ' line ' + e.line : '') + ': ' + e.message; for (const e of r.warnings || []) console.log('::warning::' + at(e)); for (const e of r.errors) console.log('::error::' + at(e)); process.exit(r.ok ? 0 : 1)"

  # The dynamic checks (spec section 10, "Dynamic checks"): best effort. Each changed piece is played in headless
  # Chromium with the EigenReel site's scripts/check-entry.mjs, in the same sandboxed worker the feed uses, at the
  # spec's phone and desktop sizes, windowed and full screen. It never blocks: continue-on-error, not a required
  # status check, and triage only mentions its result. It needs the repository variable EIGENREEL_SITE_REPO (e.g.
  # your-org/visualization-website-demo) and optionally EIGENREEL_SITE_REF (default main). No secrets, read-only token.
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: The EigenReel site (its scripts run the checks)
        if: vars.EIGENREEL_SITE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.EIGENREEL_SITE_REPO }}
          ref: ${{ vars.EIGENREEL_SITE_REF || 'main' }}
          path: site
          persist-credentials: false
      - name: The pull request's files (run only inside the browser's worker sandbox)
        if: vars.EIGENREEL_SITE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Let Chrome use its sandbox (Ubuntu 24.04 restricts user namespaces)
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Play each changed piece
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ vars.EIGENREEL_SITE_REPO }}
        run: |
          mkdir -p dynamic
          if [ -z "$SITE" ]; then
            echo '{"skipped":"The repository variable EIGENREEL_SITE_REPO is not set, so the dynamic checks did not run.","entries":[]}' > dynamic/dynamic.json
            exit 0
          fi
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | select(.status != "removed") | .filename' \
            | sed -n -e 's|^entries/\([a-z0-9][a-z0-9-]*\)\.\(js\|md\|wasm\)$|\1|p' -e 's|^sources/\([a-z0-9][a-z0-9-]*\)/.*$|\1|p' | sort -u > candidates.txt
          : > slugs.txt
          for slug in $(cat candidates.txt); do
            [ -f "pr/entries/$slug.js" ] || continue
            echo "$slug" >> slugs.txt
            node site/scripts/check-entry.mjs pr/entries "$slug" --json "dynamic/$slug.json" > "dynamic/$slug.txt" 2>&1 || true
            cat "dynamic/$slug.txt"
          done
          node -e "
            const fs = require('fs'), entries = [];
            for (const slug of fs.readFileSync('slugs.txt', 'utf8').split('\n').filter(Boolean)) {
              let r = null; try { r = JSON.parse(fs.readFileSync('dynamic/' + slug + '.json', 'utf8')); } catch {}
              let log = ''; try { log = fs.readFileSync('dynamic/' + slug + '.txt', 'utf8'); } catch {}
              const dyn = r && Array.isArray(r.checks) ? r.checks.filter(c => c.group === 'dynamic') : null, n = s => dyn.filter(c => c.status === s).length;
              entries.push(dyn ? { slug, ran: true, counts: { pass: n('pass'), fail: n('fail'), warn: n('warn'), skip: n('skip') }, failures: dyn.filter(c => c.status === 'fail').map(c => ({ title: c.title, detail: c.detail })) }
                               : { slug, ran: false, note: log.trim().split('\n').pop() || 'the harness did not run' });
            }
            fs.writeFileSync('dynamic/dynamic.json', JSON.stringify({ entries }, null, 2));
          "
      - name: Summary
        if: always()
        run: |
          [ -f dynamic/dynamic.json ] || exit 0
          node -e "
            const r = JSON.parse(require('fs').readFileSync('dynamic/dynamic.json', 'utf8')), out = ['## Dynamic checks (best effort, not blocking)'];
            if (r.skipped) out.push(r.skipped);
            for (const e of r.entries || []) {
              if (!e.ran) { out.push('- ' + e.slug + ': did not run (' + e.note + ')'); continue; }
              out.push('- ' + e.slug + ': ' + e.counts.pass + ' passed, ' + e.counts.fail + ' failed, ' + e.counts.warn + ' warnings, ' + e.counts.skip + ' skipped');
              for (const f of e.failures) out.push('  - ' + f.title + ': ' + f.detail);
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-result
          path: dynamic/

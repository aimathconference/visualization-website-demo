name: Flag a visualization for removal
description: Moderators only. Admins review these flags.
title: 'Remove: '
labels: ['flag:removal']
body:
  - type: input
    id: visualization
    attributes:
      label: Visualization
      description: Link to it in the demo (the Flag button fills this in).
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should it be removed?
    validations:
      required: true
